[package]
name = "eparna"
version = "0.7.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 requires Rust 1.85 or newer,
# ebook-rs 0.18.0 requires Rust 1.88, and the locked dependency graph
# (e.g. ordered-float 5.5.0) requires Rust 1.90; declaring it explicitly
# makes cargo enforce the floor and keeps dependabot, cargo-deny and the CI
# toolchain honest about it.
rust-version = "1.90"
description = "A fast, lightweight, cross-platform ebook reader written in pure Rust"
authors = ["SV-stark"]
license = "MIT"
repository = "https://github.com/SV-stark/eParna"
readme = "README.md"
keywords = ["ebook", "epub", "reader", "gpui", "gui"]
categories = ["gui"]

[package.metadata.wix]
upgrade-guid = "DC78F76D-E50A-419E-BF2A-01C67A6F0027"
path-guid = "7C208294-51BE-4D33-99E1-198F7E36C4FF"
license = false
eula = false

# Used by the hand-written AppImage job (cargo-bundle); cargo-dist itself has no
# AppImage support.
[package.metadata.bundle]
name = "eParna"
identifier = "com.svstark.eparna"
# Must be a recognised freedesktop.org main category -- cargo-bundle validates
# this and converts it to the macOS LSApplicationCategoryType. "Book" is not a
# valid freedesktop category and made the AppImage job fail.
category = "Education"
short_description = "A fast, lightweight, cross-platform ebook reader"
# AppStream metadata, embedded in the AppImage so software centres can list it.
appimage_metainfo_path = "assets/metainfo/com.svstark.eparna.metainfo.xml"
icon = [
    "assets/icons/16x16.png",
    "assets/icons/32x32.png",
    "assets/icons/48x48.png",
    "assets/icons/64x64.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
]

[dependencies]
gpui-kit = "0.8.1"
ebook-rs = { version = "0.18.0", default-features = false, features = [
    "serde",
    "opds",
    "pdf",
    "parallel",
    "mmap",
    "zstd",
] }
base64 = "0.23"
flate2 = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
opt-level = 3
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "eparna"
version = "0.4.0"
edition = "2024"
# Minimum supported Rust version. Edition 2024 requires Rust 1.85 or newer;
# declaring it explicitly makes cargo enforce the floor and keeps dependabot,
# cargo-deny and the CI toolchain honest about it.
rust-version = "1.85"
description = "A fast, lightweight, cross-platform ebook reader written in pure Rust"
authors = ["SV-stark"]
license = "MIT"
repository = "https://github.com/SV-stark/eParna"
readme = "README.md"
keywords = ["ebook", "epub", "reader", "gpui", "gui"]
categories = ["gui"]

[package.metadata.wix]
upgrade-guid = "DC78F76D-E50A-419E-BF2A-01C67A6F0027"
path-guid = "7C208294-51BE-4D33-99E1-198F7E36C4FF"
license = false
eula = false

# Used by the hand-written AppImage job (cargo-bundle); cargo-dist itself has no
# AppImage support.
[package.metadata.bundle]
name = "eParna"
identifier = "com.svstark.eparna"
category = "Book"
short_description = "A fast, lightweight, cross-platform ebook reader"
icon = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
]

[dependencies]
gpui-kit = "0.7.3"
ebook-rs = { version = "0.17.1", default-features = false, features = [
    "serde",
    "opds",
    "pdf",
    "parallel",
    "mmap",
    "zstd",
] }
base64 = "0.23"
# Pin: office_oxide 0.1.12+ added a required `defined_names` field to `DocumentIR`,
# which breaks pdf_oxide 0.3.78's struct literal. 0.1.11 is the last compatible
# release, so we force it for the whole dependency graph.
office_oxide = { version = "=0.1.11", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
opt-level = 3
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "eparna"
version = "0.3.0"
edition = "2024"
description = "A fast, lightweight, cross-platform ebook reader written in pure Rust"
license = "MIT"
repository = "https://github.com/SV-stark/eParna"
readme = "README.md"
keywords = ["ebook", "epub", "reader", "gpui", "gui"]
categories = ["gui"]

[dependencies]
gpui-kit = "0.7.3"
ebook-rs = { version = "0.17.1", default-features = false, features = ["serde", "opds"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
opt-level = 3
lto = true